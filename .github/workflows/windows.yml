name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $binaryDir = Join-Path $env:RUNNER_TEMP "ffmpeg-bin"
          curl.exe -L -o $zip "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Path $binaryDir -Force | Out-Null
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName (Join-Path $binaryDir "ffmpeg.exe")
          Copy-Item $ffprobe.FullName (Join-Path $binaryDir "ffprobe.exe")
          "FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFPROBE=$($ffprobe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name VideoToPPT `
            --paths skill/scripts `
            --paths app `
            --add-binary "$env:FFMPEG;." `
            --add-binary "$env:FFPROBE;." `
            app/gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoToPPT-Windows
          path: dist/VideoToPPT.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist/VideoToPPT.exe THIRD_PARTY.md `
            --title "Video to PPT $tag" `
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
